<svg xmlns="http://www.w3.org/2000/svg" width="980" height="720" viewBox="0 0 980 720">
  <defs>
    <marker id="act_arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="490" y="26" font-family="Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#0f172a">Activity Diagram - Hospital Management System (Patient Flow &amp; Billing)</text>

  <!-- Swimlane Partitions -->
  <!-- Lane 1: Patient (0 - 240) -->
  <line x1="240" y1="45" x2="240" y2="700" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="120" y="60" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0369a1">Patient</text>

  <!-- Lane 2: Receptionist (240 - 480) -->
  <line x1="480" y1="45" x2="480" y2="700" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="360" y="60" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0369a1">Receptionist</text>

  <!-- Lane 3: Doctor (480 - 720) -->
  <line x1="720" y1="45" x2="720" y2="700" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="600" y="60" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0369a1">Doctor</text>

  <!-- Lane 4: Pharmacy / Lab &amp; Billing (720 - 980) -->
  <text x="850" y="60" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0369a1">Diagnostics, Pharmacy &amp; Billing</text>

  <!-- Start Node -->
  <circle cx="120" cy="85" r="10" fill="#1e293b"/>
  <line x1="120" y1="95" x2="120" y2="120" stroke="#1e293b" stroke-width="1.5" marker-end="url(#act_arrow)"/>

  <!-- Action: Patient fills reg -->
  <rect x="40" y="120" width="160" height="38" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="120" y="144" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#0f172a">Fill Registration Details</text>

  <line x1="200" y1="139" x2="280" y2="139" stroke="#1e293b" stroke-width="1.5" marker-end="url(#act_arrow)"/>

  <!-- Action: Recep verify & check slot -->
  <rect x="280" y="120" width="160" height="38" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="360" y="144" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#0f172a">Verify &amp; Check Doctor Slot</text>

  <!-- Decision: Slot available -->
  <polygon points="360,180 400,205 360,230 320,205" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="360" y="209" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#0f172a">Available?</text>
  <line x1="360" y1="158" x2="360" y2="180" stroke="#1e293b" stroke-width="1.5" marker-end="url(#act_arrow)"/>

  <!-- If yes -> Issue token -->
  <line x1="360" y1="230" x2="360" y2="260" stroke="#1e293b" stroke-width="1.5" marker-end="url(#act_arrow)"/>
  <text x="375" y="248" font-family="Arial, sans-serif" font-size="9" fill="#16a34a">[Yes]</text>

  <rect x="280" y="260" width="160" height="38" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="360" y="284" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#0f172a">Issue Appointment Token</text>

  <!-- To Doctor Consult -->
  <line x1="440" y1="279" x2="520" y2="279" stroke="#1e293b" stroke-width="1.5" marker-end="url(#act_arrow)"/>

  <!-- Doctor Examine & Diagnosis -->
  <rect x="520" y="260" width="160" height="38" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="600" y="284" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#0f172a">Examine &amp; Record Diagnosis</text>

  <!-- Fork Bar -->
  <line x1="520" y1="340" x2="680" y2="340" stroke="#0f172a" stroke-width="5"/>
  <line x1="600" y1="298" x2="600" y2="338" stroke="#1e293b" stroke-width="1.5" marker-end="url(#act_arrow)"/>

  <!-- Parallel Branch 1: Lab Test -->
  <line x1="550" y1="342" x2="550" y2="375" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="550" y1="375" x2="760" y2="375" stroke="#1e293b" stroke-width="1.5" marker-end="url(#act_arrow)"/>
  <rect x="760" y="355" width="180" height="38" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="850" y="378" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#0f172a">Conduct Diagnostic Lab Test</text>

  <!-- Parallel Branch 2: Dispense Medicine -->
  <line x1="650" y1="342" x2="650" y2="425" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="650" y1="425" x2="760" y2="425" stroke="#1e293b" stroke-width="1.5" marker-end="url(#act_arrow)"/>
  <rect x="760" y="405" width="180" height="38" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="850" y="428" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#0f172a">Verify &amp; Dispense Drugs</text>

  <!-- Join Bar -->
  <line x1="780" y1="475" x2="920" y2="475" stroke="#0f172a" stroke-width="5"/>
  <line x1="850" y1="393" x2="850" y2="473" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="850" y1="443" x2="850" y2="473" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Billing Execution -->
  <line x1="850" y1="477" x2="850" y2="505" stroke="#1e293b" stroke-width="1.5" marker-end="url(#act_arrow)"/>
  <rect x="760" y="505" width="180" height="42" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="850" y="524" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#b91c1c">Aggregate Charges &amp;</text>
  <text x="850" y="538" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#b91c1c">calculateBill(fee, lab, ins...)</text>

  <!-- Discount Decision -->
  <polygon points="850,575 885,595 850,615 815,595" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="850" y="598" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#0f172a">Discount?</text>
  <line x1="850" y1="547" x2="850" y2="575" stroke="#1e293b" stroke-width="1.5" marker-end="url(#act_arrow)"/>

  <!-- Patient pays -->
  <line x1="815" y1="595" x2="160" y2="595" stroke="#1e293b" stroke-width="1.5" marker-end="url(#act_arrow)"/>
  <rect x="40" y="575" width="160" height="40" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="120" y="594" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#0f172a">Authorize Payment</text>
  <text x="120" y="608" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#64748b">(Cash / Card / UPI)</text>

  <!-- Payment success & receipt -->
  <line x1="120" y1="615" x2="120" y2="650" stroke="#1e293b" stroke-width="1.5" marker-end="url(#act_arrow)"/>
  <rect x="40" y="650" width="160" height="38" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="120" y="674" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#15803d">Receipt Issued &amp; Done</text>

  <!-- Final Node -->
  <circle cx="240" cy="669" r="12" fill="none" stroke="#15803d" stroke-width="2"/>
  <circle cx="240" cy="669" r="7" fill="#15803d"/>
  <line x1="200" y1="669" x2="228" y2="669" stroke="#1e293b" stroke-width="1.5" marker-end="url(#act_arrow)"/>
</svg>