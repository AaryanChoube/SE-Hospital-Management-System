<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <defs>
    <marker id="col_arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="450" y="30" font-family="Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#0f172a">Collaboration Diagram - Appointment Scheduling &amp; Billing</text>

  <!-- Object 1: Patient (Actor) -->
  <rect x="50" y="100" width="130" height="55" rx="4" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="115" y="132" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1e293b">1: Patient</text>

  <!-- Object 2: PatientPortal (Boundary) -->
  <rect x="360" y="100" width="180" height="55" rx="4" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="450" y="122" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#64748b">&lt;&lt;boundary&gt;&gt;</text>
  <text x="450" y="140" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1e293b">2: PatientPortal</text>

  <!-- Object 3: ApptController (Control) -->
  <rect x="680" y="100" width="180" height="55" rx="4" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="770" y="122" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#64748b">&lt;&lt;control&gt;&gt;</text>
  <text x="770" y="140" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e293b">3: ApptController</text>

  <!-- Object 4: ScheduleDB (Entity) -->
  <rect x="680" y="350" width="180" height="55" rx="4" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="770" y="372" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#64748b">&lt;&lt;entity&gt;&gt;</text>
  <text x="770" y="390" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1e293b">4: ScheduleDB</text>

  <!-- Object 5: BillingService (Control) -->
  <rect x="360" y="350" width="180" height="55" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="450" y="372" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#b91c1c">&lt;&lt;control&gt;&gt;</text>
  <text x="450" y="390" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#b91c1c">5: BillingService</text>

  <!-- Object 6: PaymentGateway (Boundary) -->
  <rect x="50" y="350" width="180" height="55" rx="4" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="140" y="372" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#64748b">&lt;&lt;boundary&gt;&gt;</text>
  <text x="140" y="390" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e293b">6: PaymentGateway</text>

  <!-- Links & Messages -->
  <line x1="180" y1="127" x2="360" y2="127" stroke="#1e293b" stroke-width="2"/>
  <text x="270" y="118" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#0f172a">1: submitRequest() ➔</text>
  <text x="270" y="145" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#15803d">9: returnReceipt() ⬅</text>

  <line x1="540" y1="127" x2="680" y2="127" stroke="#1e293b" stroke-width="2"/>
  <text x="610" y="118" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#0f172a">2: validate() ➔</text>

  <line x1="770" y1="155" x2="770" y2="350" stroke="#1e293b" stroke-width="2"/>
  <text x="790" y="250" font-family="Arial, sans-serif" font-size="10" fill="#0f172a">3: lockSlot() ⬇</text>

  <line x1="680" y1="140" x2="520" y2="350" stroke="#1e293b" stroke-width="2"/>
  <text x="590" y="240" font-family="Arial, sans-serif" font-size="10" fill="#0f172a">4: initBilling() ↙</text>

  <line x1="450" y1="155" x2="450" y2="350" stroke="#1e293b" stroke-width="2"/>
  <text x="470" y="250" font-family="Arial, sans-serif" font-size="10" fill="#0f172a">5: calcBill() ⬇</text>

  <line x1="360" y1="377" x2="230" y2="377" stroke="#1e293b" stroke-width="2"/>
  <text x="295" y="368" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#0f172a">7: authTxn() ⬅</text>
  <text x="295" y="395" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#15803d">8: status(OK) ➔</text>
</svg>