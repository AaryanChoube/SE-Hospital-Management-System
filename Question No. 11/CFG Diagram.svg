<svg xmlns="http://www.w3.org/2000/svg" width="700" height="600" viewBox="0 0 700 600">
  <defs>
    <marker id="cfg_arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="350" y="30" font-family="Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#0f172a">Control Flow Graph (CFG) - calculateBill() Method</text>
  <text x="350" y="50" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#dc2626">Nodes N = 7, Edges E = 8, Connected Components P = 1 => V(G) = 8 - 7 + 2(1) = 3</text>

  <!-- Node 1: Entry / Predicate 1 (fee == 0) -->
  <circle cx="280" cy="100" r="24" fill="#f8fafc" stroke="#0284c7" stroke-width="2"/>
  <text x="280" y="105" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0369a1">1</text>
  <text x="330" y="95" font-family="Arial, sans-serif" font-size="11" fill="#475569">if (fee == 0)</text>

  <!-- Node 2: return -1.0 -->
  <circle cx="120" cy="220" r="24" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="120" y="225" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#b91c1c">2</text>
  <text x="60" y="215" font-family="Arial, sans-serif" font-size="11" fill="#b91c1c">return -1.0</text>

  <!-- Node 3: totalBill = fee + labCost -->
  <circle cx="440" cy="200" r="24" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="440" y="205" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1e293b">3</text>
  <text x="480" y="195" font-family="Arial, sans-serif" font-size="11" fill="#475569">totalBill = fee + labCost</text>

  <!-- Node 4: Predicate 2 (hasIns || (isEmerg & totalBill > 5000)) -->
  <circle cx="440" cy="300" r="24" fill="#f8fafc" stroke="#0284c7" stroke-width="2"/>
  <text x="440" y="305" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0369a1">4</text>
  <text x="480" y="295" font-family="Arial, sans-serif" font-size="11" fill="#475569">if (hasIns || (isEmerg &amp; total &gt; 5k))</text>

  <!-- Node 5: totalBill = totalBill * 0.90 -->
  <circle cx="340" cy="400" r="24" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="340" y="405" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#15803d">5</text>
  <text x="250" y="400" font-family="Arial, sans-serif" font-size="11" fill="#15803d">totalBill *= 0.90</text>

  <!-- Node 6: return totalBill -->
  <circle cx="440" cy="490" r="24" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="440" y="495" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1e293b">6</text>
  <text x="480" y="485" font-family="Arial, sans-serif" font-size="11" fill="#475569">return totalBill</text>

  <!-- Node 7: Exit -->
  <circle cx="280" cy="560" r="24" fill="#1e293b" stroke="#1e293b" stroke-width="2"/>
  <text x="280" y="565" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">7</text>
  <text x="330" y="565" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0f172a">Exit / End</text>

  <!-- Edges -->
  <!-- 1 -> 2 (True) -->
  <line x1="260" y1="115" x2="135" y2="200" stroke="#dc2626" stroke-width="1.5" marker-end="url(#cfg_arrow)"/>
  <text x="180" y="145" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#dc2626">True (fee==0)</text>

  <!-- 1 -> 3 (False) -->
  <line x1="300" y1="115" x2="425" y2="185" stroke="#1e293b" stroke-width="1.5" marker-end="url(#cfg_arrow)"/>
  <text x="375" y="140" font-family="Arial, sans-serif" font-size="10" fill="#475569">False (fee!=0)</text>

  <!-- 3 -> 4 -->
  <line x1="440" y1="224" x2="440" y2="276" stroke="#1e293b" stroke-width="1.5" marker-end="url(#cfg_arrow)"/>

  <!-- 4 -> 5 (True) -->
  <line x1="420" y1="315" x2="355" y2="380" stroke="#16a34a" stroke-width="1.5" marker-end="url(#cfg_arrow)"/>
  <text x="365" y="340" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#16a34a">True (Discount)</text>

  <!-- 4 -> 6 (False) -->
  <line x1="460" y1="315" x2="520" y2="380" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="520" y1="380" x2="460" y2="475" stroke="#1e293b" stroke-width="1.5" marker-end="url(#cfg_arrow)"/>
  <text x="525" y="400" font-family="Arial, sans-serif" font-size="10" fill="#475569">False (No Disc)</text>

  <!-- 5 -> 6 -->
  <line x1="360" y1="415" x2="425" y2="470" stroke="#1e293b" stroke-width="1.5" marker-end="url(#cfg_arrow)"/>

  <!-- 2 -> 7 -->
  <line x1="120" y1="244" x2="120" y2="540" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="120" y1="540" x2="256" y2="555" stroke="#dc2626" stroke-width="1.5" marker-end="url(#cfg_arrow)"/>

  <!-- 6 -> 7 -->
  <line x1="420" y1="505" x2="300" y2="545" stroke="#1e293b" stroke-width="1.5" marker-end="url(#cfg_arrow)"/>
</svg>