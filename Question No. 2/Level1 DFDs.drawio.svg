<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="680" viewBox="0 0 1050 680">
  <defs>
    <marker id="arrow1" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="525" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#0f172a">Level 1 DFD - Hospital Management System (HMS)</text>

  <!-- Entities Left -->
  <rect x="30" y="80" width="130" height="50" rx="4" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="95" y="110" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1e293b">Patient</text>

  <rect x="30" y="240" width="130" height="50" rx="4" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="95" y="270" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1e293b">Receptionist</text>

  <!-- Entities Right -->
  <rect x="890" y="80" width="130" height="50" rx="4" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="955" y="110" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1e293b">Doctor</text>

  <rect x="890" y="220" width="130" height="50" rx="4" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="955" y="250" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1e293b">Lab Technician</text>

  <rect x="890" y="360" width="130" height="50" rx="4" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="955" y="390" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1e293b">Pharmacist</text>

  <rect x="890" y="520" width="130" height="50" rx="4" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="955" y="550" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1e293b">Admin</text>

  <!-- Processes in Center Grid -->
  <!-- 1.0 -->
  <circle cx="280" cy="140" r="50" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
  <text x="280" y="130" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#0369a1">1.0 Patient Reg</text>
  <text x="280" y="148" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#0369a1">&amp; Appt Booking</text>

  <!-- 2.0 -->
  <circle cx="700" cy="140" r="50" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
  <text x="700" y="130" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#0369a1">2.0 Doctor</text>
  <text x="700" y="148" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#0369a1">Consult &amp; EHR</text>

  <!-- 3.0 -->
  <circle cx="700" cy="270" r="50" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
  <text x="700" y="262" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#0369a1">3.0 Lab &amp;</text>
  <text x="700" y="278" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#0369a1">Diagnostics</text>

  <!-- 4.0 -->
  <circle cx="700" cy="400" r="50" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
  <text x="700" y="392" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#0369a1">4.0 Pharmacy</text>
  <text x="700" y="408" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#0369a1">&amp; Stock</text>

  <!-- 5.0 -->
  <circle cx="280" cy="450" r="50" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="280" y="442" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#b91c1c">5.0 Billing &amp;</text>
  <text x="280" y="458" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#b91c1c">Payment</text>

  <!-- 6.0 -->
  <circle cx="490" cy="580" r="45" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
  <text x="490" y="575" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#0369a1">6.0 Hospital</text>
  <text x="490" y="590" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#0369a1">Admin</text>

  <!-- Data Stores (Open Rectangles) -->
  <!-- D1 Patient Master -->
  <path d="M 440 90 L 540 90 M 440 120 L 540 120" stroke="#334155" stroke-width="2"/>
  <text x="490" y="108" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#1e293b">D1 Patient Master</text>

  <!-- D2 Appt Schedule -->
  <path d="M 440 150 L 540 150 M 440 180 L 540 180" stroke="#334155" stroke-width="2"/>
  <text x="490" y="168" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#1e293b">D2 Appt Schedule</text>

  <!-- D3 Medical Records -->
  <path d="M 440 230 L 540 230 M 440 260 L 540 260" stroke="#334155" stroke-width="2"/>
  <text x="490" y="248" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#1e293b">D3 Medical Records</text>

  <!-- D4 Lab Tests -->
  <path d="M 440 310 L 540 310 M 440 340 L 540 340" stroke="#334155" stroke-width="2"/>
  <text x="490" y="328" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#1e293b">D4 Lab Reports</text>

  <!-- D5 Pharmacy -->
  <path d="M 440 390 L 540 390 M 440 420 L 540 420" stroke="#334155" stroke-width="2"/>
  <text x="490" y="408" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#1e293b">D5 Drug Stock</text>

  <!-- D6 Billing Store -->
  <path d="M 440 470 L 540 470 M 440 500 L 540 500" stroke="#334155" stroke-width="2"/>
  <text x="490" y="488" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#1e293b">D6 Invoices / Ledger</text>

  <!-- Flows -->
  <line x1="160" y1="110" x2="230" y2="130" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow1)"/>
  <line x1="160" y1="250" x2="235" y2="160" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow1)"/>
  <line x1="330" y1="120" x2="435" y2="105" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow1)"/>
  <line x1="330" y1="150" x2="435" y2="165" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow1)"/>

  <line x1="890" y1="110" x2="750" y2="130" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow1)"/>
  <line x1="650" y1="140" x2="545" y2="240" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow1)"/>

  <line x1="890" y1="245" x2="750" y2="265" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow1)"/>
  <line x1="650" y1="270" x2="545" y2="320" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow1)"/>

  <line x1="890" y1="385" x2="750" y2="395" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow1)"/>
  <line x1="650" y1="400" x2="545" y2="405" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow1)"/>

  <!-- Aggregation to Billing 5.0 -->
  <line x1="440" y1="250" x2="320" y2="420" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3" marker-end="url(#arrow1)"/>
  <line x1="440" y1="330" x2="330" y2="440" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3" marker-end="url(#arrow1)"/>
  <line x1="440" y1="410" x2="330" y2="460" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3" marker-end="url(#arrow1)"/>
  <line x1="330" y1="475" x2="435" y2="485" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow1)"/>

  <line x1="240" y1="420" x2="140" y2="135" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow1)"/>
  <text x="170" y="300" font-family="Arial, sans-serif" font-size="10" fill="#b91c1c" transform="rotate(-70, 170, 300)">Receipt &amp; Bill</text>

  <!-- Admin flows -->
  <line x1="890" y1="545" x2="540" y2="580" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow1)"/>
  <line x1="490" y1="505" x2="490" y2="535" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow1)"/>
</svg>